    <path d="M228 73 C246 76 257 77 274 69 C288 62 301 58 320 62" stroke="#2e63e6" stroke-width="7"/>
    <path d="M228 96 C246 99 257 100 274 94 C289 89 302 85 320 90" stroke="#7561dc" stroke-width="7"/>
    <path d="M228 119 C246 123 258 126 275 121 C292 116 304 113 320 118" stroke="#25aa91" stroke-width="7"/>
