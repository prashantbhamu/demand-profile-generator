<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" role="img" aria-labelledby="prism-logo-title prism-logo-description">
  <title id="prism-logo-title">PRISM</title>
  <desc id="prism-logo-description">A demand curve enters a prism and separates into three future demand trajectories.</desc>
  <style>
    @font-face {
      font-family: "Russo One";
      src: url("fonts/RussoOne-Regular.ttf") format("truetype");
      font-display: swap;
    }
    .prism-wordmark {
      fill: #0c1d43;
      font-family: "Russo One", "Arial Black", sans-serif;
      font-size: 108px;
      letter-spacing: 4px;
    }
  </style>
  <g id="prism-mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="prism-input-trajectory" d="M25.4 92 C54.3 96 64.5 95 79.8 83 C95.9 70 107.9 66 124 78" stroke="#2457d6" stroke-width="7"/>
    <path d="M134 30 L209 70 L192 116 L134 145 Z" fill="#ffffff" stroke="#0c1d43" stroke-width="5"/>
    <path d="M134 30 L173 86 L209 70 Z" fill="#0c1d43" stroke="#0c1d43" stroke-width="4"/>
    <path d="M173 86 L209 70 L192 116 L134 145 Z" fill="#c7d4f7" stroke="#0c1d43" stroke-width="4"/>
    <path d="M134 30 L173 86 L134 145" stroke="#0c1d43" stroke-width="5"/>
    <path id="prism-output-trajectory-1" d="M228 73 C243.3 76 252.7 77 267.1 69 C279 62 290.1 58 306.2 62" stroke="#2e63e6" stroke-width="7"/>
    <path id="prism-output-trajectory-2" d="M228 96 C243.3 99 252.7 100 267.1 94 C279.9 89 290.9 85 306.2 90" stroke="#7561dc" stroke-width="7"/>
    <path id="prism-output-trajectory-3" d="M228 119 C243.3 123 253.5 126 267.9 121 C282.4 116 292.6 113 306.2 118" stroke="#25aa91" stroke-width="7"/>
  </g>
  <text class="prism-wordmark" x="370" y="128">PRISM</text>
</svg>
